name: discotope_tools_env
channels:
  - conda-forge      # good to put conda-forge first for modern builds
  - pytorch
  - pyg
  - defaults
dependencies:
  - python=3.9
  - pip
  - setuptools>=68
  - wheel
  - joblib
  - pytorch=1.11
  - cudatoolkit=11.3
  - pip:
      - fair-esm==0.5.0
      - biopython==1.80
      - biotite==0.34
      - xgboost==1.6.1
      - pygam==0.9.0
      - numpy>=1.24,<1.25
      - pandas>=1.4,<1.5
