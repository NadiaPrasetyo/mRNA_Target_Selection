name: discotope_tools_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - numpy=1.24.*
  - pandas=1.4.*
  - biopython=1.80
  - biotite=0.34
  - xgboost=1.6.1
  - pygam=0.9.0
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu113
      - torch==1.11.0+cu113

