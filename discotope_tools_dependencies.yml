name: discotope_tools_env
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=1.11
  - cudatoolkit=11.3
  - pyg
  - pip
  - pip:
      - fair-esm==0.5.0
      - biopython==1.80
      - biotite==0.34
      - xgboost==1.6.1
      - pygam==0.9.0
      - numpy==1.24.*
      - pandas==1.4.*